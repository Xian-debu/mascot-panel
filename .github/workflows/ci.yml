name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen
      - name: ruff
        run: uv run ruff check .
      - name: pyright
        run: uv run pyright
      - name: pytest (pure logic, no desktop)
        run: uv run pytest -m "not platform"
      - name: doctor smoke
        run: uv run mascot doctor --offline
