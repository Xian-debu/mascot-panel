[project]
name = "mascot"
version = "0.1.1"
description = "天选姬桌宠跟随框 + 环绕球（重构版）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pywebview>=6.2,<7",
  "pillow>=12",
  "pydantic-settings>=2.4",
  "psutil>=6",
]

[project.scripts]
mascot = "mascot_app.cli:main"

# 只保留"读代码"用的静态检查；行为验证靠真机自用，不写一次性验收脚本（见 AGENTS.md）
[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mascot_core", "src/mascot_win", "src/mascot_render", "src/mascot_app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
