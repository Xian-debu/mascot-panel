<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mascot</title>
<style>
  :root {
    --bg: #0e1116; --card: #161b22; --border: #2d333b;
    --text: #e6edf3; --dim: #8b949e; --accent: #56d4dd; --amber: #e3b341;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui; color: var(--text); }
  .panel { height: 100%; box-sizing: border-box; margin: 6px; border-radius: 14px;
    background: var(--bg); border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .title { color: var(--text); font-weight: 600; }
  .body { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; }
  .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .foot { padding: 8px 10px; border-top: 1px solid var(--border); color: var(--dim); font-size: 11px; }
  .hint { margin-top: auto; color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<div class="panel">
  <div class="bar"><span class="dot"></span><span class="title">MASCOT M1 · 窗口与渲染共存</span></div>
  <div class="body">
    <div class="msg"><div class="who">system</div>这是 WebView2 渲染的面板骨架。透明圆角、无边框、置顶。</div>
    <div class="msg"><div class="who">system</div>若你看到这块面板与右侧/上方的青色小球同时存在，说明一个进程里两套渲染都通了。</div>
    <div class="hint">M1 spike · 自动关闭</div>
  </div>
  <div class="foot">spike 模式：静默自检，不写入用户数据</div>
</div>
</body>
</html>
